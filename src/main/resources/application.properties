spring.application.name=rankpadel

# ── Base de datos ──────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/rankpadel_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Argentina/Buenos_Aires
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
# Apagado por defecto: en producción imprime y formatea CADA consulta, y eso es CPU, disco
# de logs y ruido que tapa los errores de verdad. Para depurar en local: JPA_SHOW_SQL=true.
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
logging.level.org.springframework.security=WARN

# ── Pool de conexiones ─────────────────────────────────────────
# Contra un MySQL gestionado (Aiven), una conexión que el servidor cierra por su cuenta y
# el pool sigue creyendo viva sale como un error intermitente imposible de reproducir. Por
# eso el pool las recicla ANTES: max-lifetime tiene que quedar por debajo del wait_timeout
# del servidor, y el keepalive por debajo del max-lifetime.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
# Timeouts del driver: sin esto, una conexión colgada se lleva puesto el hilo hasta que
# alguien reinicie. El de socket tiene que aguantar la consulta más lenta (estadísticas).
spring.datasource.hikari.data-source-properties.connectTimeout=10000
spring.datasource.hikari.data-source-properties.socketTimeout=60000

# ── Compresión ─────────────────────────────────────────────────
# El JSON de las pantallas grandes (agenda del día, estadísticas, ranking) baja bastante
# comprimido, y del otro lado hay un celular con 4G.
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,application/javascript
server.compression.min-response-size=1024

# ── Flyway ─────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

# ── JWT ────────────────────────────────────────────────────────
# En producción: configurá JWT_SECRET como variable de entorno (BASE64 de al menos 256 bits).
# Por defecto usa la clave de desarrollo (SOLO para dev local).
jwt.secret=${JWT_SECRET:cmFua3BhZGVsLWRldi1rZXktMjAyNi1jaGFuZ2UtaW4tcHJvZHVjdGlvbiEh}
jwt.expiration-ms=86400000

# ── Swagger UI ─────────────────────────────────────────────────
# APAGADO por defecto. Estaba abierto con permitAll: cualquiera que entrara al backend de
# un cliente veía la API entera documentada, endpoints de administración incluidos. Para
# usarlo en local: SPRINGDOC_ENABLED=true.
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ── Jackson ────────────────────────────────────────────────────
# OJO: acá no va nada. `JacksonConfig` define un ObjectMapper @Primary y eso hace que
# Spring Boot ignore TODAS las properties `spring.jackson.*`. Lo que haya que configurar
# (fechas, nulos, propiedades desconocidas) va en esa clase o no tiene efecto.

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
app.upload.dir=${UPLOAD_DIR:uploads}
app.upload.public-base-url=${UPLOAD_PUBLIC_BASE_URL:/uploads}

# ── Zona horaria ───────────────────────────────────────────────
app.zona-horaria=${APP_ZONA_HORARIA:America/Argentina/Buenos_Aires}

# ── Mercado Pago / Pagos ───────────────────────────────────────
app.mercadopago.access-token=${MERCADO_PAGO_ACCESS_TOKEN:}
app.mercadopago.back-url-base=${MERCADO_PAGO_BACK_URL_BASE:http://localhost:5173}
app.mercadopago.notification-url=${MERCADO_PAGO_NOTIFICATION_URL:}
# Secret del webhook (panel de MP → Webhooks). Si está vacío, no se valida la firma.
app.mercadopago.webhook-secret=${MERCADO_PAGO_WEBHOOK_SECRET:}
app.pagos.porcentaje-senia-default=${PAGOS_SENIA_PORCENTAJE:50}
# URL del front, para armar el enlace del turno que le llega al jugador por mail. Por
# defecto usa la misma que la vuelta de Mercado Pago: es el mismo sitio, y tener dos
# variables para lo mismo termina con una de las dos vieja y enlaces muertos.
app.front.base-url=${FRONT_BASE_URL:${MERCADO_PAGO_BACK_URL_BASE:http://localhost:5173}}
app.pagos.expiracion-pago-minutos=${PAGOS_EXPIRACION_MINUTOS:30}
app.pagos.modo-demo=${PAGOS_MODO_DEMO:false}
# Solo la instancia de demostracion. Habilita el modo demo contra una base remota;
# sin esto, SecretsGuard aborta el arranque (ver comentario en esa clase).
app.pagos.demo-publica=${PAGOS_DEMO_PUBLICA:false}

# ── Notificaciones por mail al club ────────────────────────────
# Si MAIL_HOST y NOTIFICACIONES_REMITENTE estan vacios, no se envia nada
# (el sistema funciona igual). Destino: el mail de Configuracion de sede;
# si no hay ninguno cargado, cae en NOTIFICACIONES_DESTINO.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.notificaciones.remitente=${NOTIFICACIONES_REMITENTE:}
app.notificaciones.destino=${NOTIFICACIONES_DESTINO:}
# El healthcheck NO depende del SMTP: sin mail configurado daria DOWN siempre, y con
# mail configurado una caida del proveedor marcaria la app entera como caida (y en
# Railway tumbaria el deploy). Los fallos de envio se loguean, no rompen nada.
management.health.mail.enabled=false

# ── Turnos fijos (abonos) ──────────────────────────────────────
# Cuantas semanas de reservas se mantienen generadas por adelantado.
app.turnos-fijos.semanas-adelante=${TURNOS_FIJOS_SEMANAS:6}

# ── Cloudinary (imagenes persistentes) ─────────────────────────
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
